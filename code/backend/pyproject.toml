[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduler-database-foundation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.15.1,<3",
  "fastapi>=0.121,<1",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx2>=2.16,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requires disposable local PostgreSQL"]
